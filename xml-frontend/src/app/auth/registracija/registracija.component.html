<section class="card">
  <h1>Registracija građanina</h1>
  <p *ngIf="error" class="error" role="alert">{{ error }}</p>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="ime">Ime</label>
    <input id="ime" type="text" formControlName="ime" autocomplete="given-name" [attr.aria-invalid]="form.controls['ime'].touched && form.controls['ime'].invalid" aria-describedby="ime-hint">
    <small id="ime-hint" *ngIf="form.controls['ime'].touched && form.controls['ime'].invalid" class="error">Unesite ime.</small>
    <label for="prezime">Prezime</label>
    <input id="prezime" type="text" formControlName="prezime" autocomplete="family-name" [attr.aria-invalid]="form.controls['prezime'].touched && form.controls['prezime'].invalid" aria-describedby="prezime-hint">
    <small id="prezime-hint" *ngIf="form.controls['prezime'].touched && form.controls['prezime'].invalid" class="error">Unesite prezime.</small>
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" [attr.aria-invalid]="form.controls['email'].touched && form.controls['email'].invalid" aria-describedby="email-hint">
    <small id="email-hint" *ngIf="form.controls['email'].touched && form.controls['email'].invalid" class="error">Unesite ispravan email.</small>
    <label for="lozinka">Lozinka</label>
    <input id="lozinka" type="password" formControlName="lozinka" autocomplete="new-password" [attr.aria-invalid]="form.controls['lozinka'].touched && form.controls['lozinka'].invalid" aria-describedby="lozinka-hint">
    <small id="lozinka-hint" *ngIf="form.controls['lozinka'].touched && form.controls['lozinka'].invalid" class="error">Najmanje 8 znakova i najviše 72 UTF-8 bajta. Razmaci se čuvaju.</small>
    <button type="submit" [disabled]="pending">{{ pending ? 'Slanje...' : 'Registruj se' }}</button>
  </form>
  <p>Već imate nalog? <a routerLink="/auth/prijava">Prijavite se</a></p>
</section>
